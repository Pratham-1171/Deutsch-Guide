name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format sources and show exact formatter diff
        run: |
          dart format lib test
          git diff --unified=4 -- lib/features/profile/data/profile_repository.dart lib/features/profile/presentation/learner_dashboard_screen.dart
          dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android debug APK
        if: hashFiles('android/app/build.gradle.kts') != ''
        run: flutter build apk --debug

      - name: Build Web
        if: hashFiles('web/index.html') != ''
        run: flutter build web

  build_windows:
    name: Build Windows desktop
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        if: hashFiles('windows/CMakeLists.txt') != ''
        run: flutter build windows --debug

name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=show lib/features/nlp/domain/german_nlp_engine.dart lib/features/nlp/presentation/german_grammar_screen.dart test/german_nlp_engine_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android debug APK
        if: hashFiles('android/app/build.gradle.kts') != ''
        run: flutter build apk --debug --dart-define=SUPABASE_URL=https://egjtrbxjvrdsgsamvctc.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_0EMk0LCrbMWyGzVguJIOsA_O5IaTJ-7 --dart-define=APP_ENV=prod

      - name: Upload Android debug APK
        if: success() && hashFiles('android/app/build.gradle.kts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-guide-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Web
        if: hashFiles('web/index.html') != ''
        run: flutter build web --dart-define=SUPABASE_URL=https://egjtrbxjvrdsgsamvctc.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_0EMk0LCrbMWyGzVguJIOsA_O5IaTJ-7 --dart-define=APP_ENV=prod


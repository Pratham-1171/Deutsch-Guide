name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add the standalone Material UI package
        run: flutter pub add material_ui

      - name: Migrate to standalone Material UI imports
        run: dart fix --apply --code=migrate_design_widgets

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Save migration, formatter changes and dependency lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add lib test pubspec.yaml pubspec.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: migrate standalone Flutter Material UI"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

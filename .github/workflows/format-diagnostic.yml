name: Temporary Dart formatter diagnostic

on:
  push:
    branches: [feature/a1-vocabulary-foundation]

permissions:
  contents: read

jobs:
  formatter-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
      - name: Print exact formatted test file
        run: dart format --output=show test/vocabulary_repository_test.dart

name: Generate Flutter platform projects

on:
  push:
    branches:
      - feat/phase-4-learner-foundation

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Check whether platform projects already exist
        id: platform_check
        shell: bash
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.platform_check.outputs.exists == 'false'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Generate Android, Web and Windows projects
        if: steps.platform_check.outputs.exists == 'false'
        run: flutter create --platforms=android,web,windows --org com.pratham1171 --project-name deutsch_guide .

      - name: Register the Android Supabase auth callback
        if: steps.platform_check.outputs.exists == 'false'
        shell: python
        run: |
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if 'android:scheme="deutschguide"' not in text:
              activity_start = text.find("<activity")
              activity_end = text.find("</activity>", activity_start)
              if activity_start < 0 or activity_end < 0:
                  raise SystemExit("Could not locate the Flutter MainActivity in AndroidManifest.xml")
              intent_filter = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data
                          android:scheme="deutschguide"
                          android:host="auth-callback" />
                  </intent-filter>
              """
              text = text[:activity_end] + intent_filter + text[activity_end:]
              manifest.write_text(text, encoding="utf-8")

      - name: Verify permanent Android application ID
        if: steps.platform_check.outputs.exists == 'false'
        run: |
          grep -q 'applicationId = "com.pratham1171.deutsch_guide"' android/app/build.gradle.kts
          grep -q 'android:scheme="deutschguide"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="auth-callback"' android/app/src/main/AndroidManifest.xml

      - name: Commit generated platform projects
        if: steps.platform_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .metadata android web windows
          if git diff --cached --quiet; then
            echo "No platform scaffold changes to commit."
          else
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git commit -m "chore: generate Flutter platform projects"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
